<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <meta name="theme-color" content="#15282b" />
    <title>VICE LINE — Little Havana '87</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #14252a;
        font-family: system-ui;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      #status {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
    </style>
  </head>
  <body>
    <canvas id="game" aria-label="VICE LINE open world crime game"></canvas>
    <p id="status" role="status" aria-live="polite"></p>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
